<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ความลับกรุงศรี_demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* เกมพิกเซลอาร์ตเดี่ยว: ภาพฉากเต็มจอ + ชั้นโต้ตอบ HTML ทับตำแหน่งแผงในภาพ */
:root{
  --wood:#3a1f0f; --wood2:#4d2a14; --wood3:#2a1409; --gold:#d9a441; --gold2:#f6d98a; --gold3:#a8731d;
  --parch:#e6cd9d; --parch2:#d3b27a; --ink:#3b2412; --cream:#f1e2c0; --red:#c8442f; --green:#5aa63f; --blue:#3f86c8;
  --f-disp:'Kanit','Sarabun',sans-serif; --f-body:'Sarabun','Kanit',sans-serif;
}
html,body{height:100%;margin:0;background:#0d0603;color:var(--cream);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
button{font-family:inherit}
html{overscroll-behavior:none}
/* #app ถูกตั้งขนาดและหมุนเป็นแนวนอนเสมอโดย layout() ใน core.js (--ew/--eh = ขนาดจอแนวนอนจริง) */
#app{position:fixed;left:0;top:0;width:var(--ew,100vw);height:var(--eh,100vh);transform-origin:0 0;overflow:hidden;background:#0d0603}
.fill{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(14px) brightness(.55) saturate(1.2);image-rendering:auto;pointer-events:none}
.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.scr.on{display:flex}
.stage{position:relative;overflow:hidden;background:#000;flex:none}
.stage>.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;pointer-events:none}
.ov{position:absolute;inset:0}
.a{position:absolute}
.hot{position:absolute;cursor:pointer;border-radius:calc(var(--u)*8);-webkit-tap-highlight-color:transparent}
.hot:hover{background:rgba(255,226,140,.16);box-shadow:inset 0 0 0 calc(var(--u)*2.5) rgba(255,220,120,.7)}
.hot:active{background:rgba(255,226,140,.3)}
.cv{position:absolute;overflow:hidden}
.px{image-rendering:pixelated}

/* ผิวไม้-ทองแบบพิกเซล */
.wood{background:linear-gradient(var(--wood2),var(--wood3));border:calc(var(--u)*3) solid var(--gold3);border-radius:calc(var(--u)*5);box-shadow:inset 0 0 0 calc(var(--u)*2) #6b3d1b, 0 calc(var(--u)*3) 0 #140803;color:var(--cream)}
.parch{background:var(--parch);border:calc(var(--u)*3) solid #8a5a22;border-radius:calc(var(--u)*5);box-shadow:inset 0 0 0 calc(var(--u)*2) #f3e2b8, 0 calc(var(--u)*3) 0 #140803;color:var(--ink)}
.gbtn{background:linear-gradient(#f9d66a,#d38f1c);color:#3a1d08;border:calc(var(--u)*3) solid #7a4a10;border-radius:calc(var(--u)*6);box-shadow:inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.55),0 calc(var(--u)*4) 0 #4a2a08;font-family:var(--f-disp);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.gbtn:hover{filter:brightness(1.1)}
.gbtn:active{transform:translateY(calc(var(--u)*3));box-shadow:inset 0 calc(var(--u)*3) 0 rgba(255,255,255,.4),0 calc(var(--u)*1) 0 #4a2a08}
.gbtn.off{filter:grayscale(.8) brightness(.7);pointer-events:none}
.dbtn{background:linear-gradient(#6a3d1a,#43240f);color:var(--cream);border:calc(var(--u)*3) solid var(--gold3);border-radius:calc(var(--u)*6);font-family:var(--f-disp);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 calc(var(--u)*3) 0 #140803}
.dbtn:hover{filter:brightness(1.2)}
.dbtn.sel{background:linear-gradient(#f9d66a,#d38f1c);color:#3a1d08;border-color:#fff0b0}
.dbtn.ok{background:linear-gradient(#7cc65a,#3f7f2b);color:#fff;border-color:#c9f2a8}
.dbtn.bad{background:linear-gradient(#d9624a,#8c2a1a);color:#fff;border-color:#ffb3a0;animation:shake .35s}
.dbtn.dim{opacity:.45;pointer-events:none}
.t{font-family:var(--f-disp);line-height:1.25}
.c{display:flex;align-items:center;justify-content:center;text-align:center}
.cv.c{flex-direction:column}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glim{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pop{animation:pop .3s ease-out both}
.glim{animation:glim 1.4s infinite;pointer-events:auto;cursor:pointer;border-radius:50%;background:radial-gradient(circle,rgba(255,244,180,.95),rgba(255,200,80,.5) 45%,transparent 70%)}

/* กล่องคำพูด / toast */
.say{display:flex;align-items:flex-start;color:var(--cream);line-height:1.35;overflow:hidden}
.toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:50;pointer-events:none;padding:calc(var(--u)*7) calc(var(--u)*20);font-family:var(--f-disp);font-weight:600;font-size:calc(var(--u)*24);text-align:center;animation:fadein .2s both;max-width:46%;white-space:normal}
.toast.good{border-color:#a8e08a;color:#e8ffd8}
.toast.bad{border-color:#ff9a86;color:#ffe3dc}
.toast.gold{border-color:#fff0b0;color:#fff3c8}

/* หน้าต่างเต็มจอ (modal) */
.mod{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,4,2,.78);backdrop-filter:blur(3px);z-index:100;--u:calc(min(var(--ew,100vw),var(--eh,100vh)*1.7768)/1672)}
.mod.on{display:flex;animation:fadein .2s}
.card{max-width:calc(var(--ew,100vw)*.97);max-height:calc(var(--eh,100vh)*.95);overflow:auto;position:relative}
.mb{font-size:calc(var(--u)*26)}
.mh{font-family:var(--f-disp);font-weight:600;color:var(--gold2);font-size:calc(var(--u)*40);text-shadow:0 calc(var(--u)*3) 0 #140803}
.row{display:flex;gap:calc(var(--u)*16);align-items:center}
.rot{display:none!important;position:fixed;inset:0;z-index:999;background:#0d0603;color:var(--cream);align-items:center;justify-content:center;text-align:center;font-family:var(--f-disp);font-size:22px;padding:30px}

</style>

<div id="app">
  <div class="scr on" id="s-menu"></div>
  <div class="scr" id="s-level"></div>
  <div class="scr" id="s-map"></div>
  <div class="mod" id="m-lesson"></div>
  <div class="mod" id="m-pop"></div>
</div>
<div class="rot">กรุณาหมุนจอเป็นแนวนอนเพื่อเล่น<br>ความลับกรุงศรี</div>

<script src="js/core.js"></script>
<script src="js/lessons.js"></script>
<script src="js/lessons2.js"></script>
<script src="js/levels1.js"></script>
<script src="js/levels2.js"></script>
<script src="js/levels3.js"></script>
<script src="js/boot.js"></script>

</body></html>
