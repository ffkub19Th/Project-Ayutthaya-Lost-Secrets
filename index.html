<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ปริศนากู้กรุงศรี</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Cinzel:wght@500;700&family=Pridi:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one framed "game cabinet" in carved dark wood and gold; screens swap inside it.
   Scenes are drawn as SVG (sunset menu, jungle ruin, parchment maps); puzzles sit on aged paper. */
:root{
  color-scheme:dark;
  --night:#120a05; --wood:#2a160b; --wood2:#3d2212; --wood3:#54301a;
  --brick:#8c3a1c; --brick2:#b9502a; --gold:#e3b657; --gold2:#f6dc95; --gold-d:#9b7127;
  --paper:#ecd9a8; --paper2:#d8bd84; --paper-d:#a98550; --ink:#3a2412; --ink2:#6b4a2a;
  --moss:#2b4a32; --moss2:#3f6a45; --teal:#3f7c80; --ok:#6fdc83; --bad:#ff7a5c;
  --txt:#f3e6c4; --txt2:#cdb88a;
  --f-title:'Chonburi','Pridi','Loma',serif;
  --f-head:'Pridi','Sarabun','Loma',serif;
  --f-body:'Sarabun','Noto Sans Thai','Loma',system-ui,sans-serif;
  --f-lat:'Cinzel','Times New Roman',serif;
  --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .07  0 0 0 .32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);background-image:radial-gradient(ellipse at 50% 0,#3a2010 0,#120a05 70%);background-attachment:fixed;color:var(--txt);font:16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
#game{max-width:1180px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffe9a8cc}70%{box-shadow:0 0 0 14px #ffe9a800}100%{box-shadow:0 0 0 0 #ffe9a800}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glint{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translate(var(--dx),-90px);opacity:0}}
@keyframes sail{from{transform:translateX(-18%)}to{transform:translateX(118%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1deg)}}
@keyframes door{from{transform:scaleX(1)}to{transform:scaleX(.08)}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* ---------- screen shell ---------- */
.screen{position:relative;border:3px solid var(--gold-d);border-radius:18px;overflow:hidden;background:linear-gradient(#2e180b,#1c0f07);box-shadow:0 0 0 2px #000,0 16px 44px #000c,inset 0 0 0 2px #e3b65733;animation:fadein .35s ease}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(#4d2c16,#341b0d);border-bottom:2px solid var(--gold-d);position:relative;z-index:3;flex-wrap:wrap}
.hud-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-width:40px;height:40px;padding:0 10px;border-radius:99px;border:2px solid var(--gold-d);background:linear-gradient(#5a3820,#3a2112);color:var(--gold2);box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #1a0b04;transition:transform .12s,filter .12s}
.iconbtn:hover{filter:brightness(1.2);transform:translateY(-1px)}
.iconbtn svg{width:20px;height:20px}
.iconbtn b{font:700 .9rem var(--f-head);color:var(--gold2)}
.iconbtn.round{width:40px;padding:0;border-radius:50%}
.hintbtn:disabled{opacity:.45;cursor:not-allowed}
.ribbon{position:relative;padding:.38em 1.5em;border-radius:8px;background:linear-gradient(#b4502a,#772c12);border:2px solid var(--gold);color:#fff0c8;font:700 1.05rem/1.3 var(--f-head);text-shadow:0 2px 0 #4a1a08;box-shadow:inset 0 1px 0 #ffffff33,0 3px 0 #2a0f04}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.2em .8em;border-radius:99px;border:2px solid var(--gold-d);background:#2b170b;font:700 .95rem var(--f-head);color:var(--gold2);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px;color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:46px;padding:.55em 1.5em;border-radius:12px;border:2px solid var(--gold);background:linear-gradient(#bf552d,#7e2f14);color:#fff1cf;font:700 1.05rem/1.3 var(--f-head);text-shadow:0 2px 0 #4a1a08;box-shadow:inset 0 2px 0 #ffffff33,inset 0 -3px 0 #0004,0 4px 0 #3a1507,0 8px 14px #0007;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff33,0 1px 0 #3a1507}
.btn svg{width:20px;height:20px}
.btn.lg{min-height:54px;font-size:1.2rem}
.btn.moss{background:linear-gradient(#3b5f40,#21392a);border-color:var(--gold-d);box-shadow:inset 0 2px 0 #ffffff22,inset 0 -3px 0 #0004,0 4px 0 #0e1a12,0 8px 14px #0007}
.btn.green{background:linear-gradient(#45934f,#245c33);box-shadow:inset 0 2px 0 #ffffff33,inset 0 -3px 0 #0004,0 4px 0 #10301a,0 8px 14px #0007}
.btn.wood{background:linear-gradient(#5a3820,#341c0d);border-color:var(--gold-d)}
.btn.block{width:100%}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:not-allowed;transform:none}
.btn.pulse{animation:pulse 1.8s infinite}

.panel{background:linear-gradient(#3e2313,#2a160b);border:2px solid var(--gold-d);border-radius:12px;padding:12px;box-shadow:inset 0 0 0 1px #0007,inset 0 0 22px #0006}
.panel h3,.paper h3{font:700 1.05rem var(--f-head)}
.panel h3{color:var(--gold2)}
.paper{position:relative;color:var(--ink);background:var(--tex),radial-gradient(ellipse at 30% 15%,#f6e8c0,#e6cf98 55%,#cfae70);border:2px solid #8a6a35;border-radius:10px;box-shadow:inset 0 0 36px #8a5a2288,inset 0 0 0 3px #f4e4b866,0 6px 18px #0008}
.paper h3{color:#5a2c10}
.muted{color:var(--txt2)}
.ink2{color:var(--ink2)}

/* ---------- menu ---------- */
.menu{aspect-ratio:16/9;min-height:560px}
.menu .bg{position:absolute;inset:0;width:100%;height:100%}
.menu .hero{position:absolute;left:3.5%;bottom:-1%;height:74%;aspect-ratio:200/330;filter:drop-shadow(0 10px 12px #0008)}
.menu .hero svg{width:100%;height:100%}
.menu .fg{position:absolute;inset:0;pointer-events:none}
.menu .tools{position:absolute;right:16px;top:14px;display:flex;gap:10px;z-index:4}
.menu .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(44%,470px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;z-index:3}
.title{font-family:var(--f-title);font-size:clamp(38px,6.4vw,76px);line-height:1.08;background:linear-gradient(#fff4c4,#eebd4f 52%,#a8701e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a2208) drop-shadow(0 7px 10px #000b);padding-block:.05em}
.subtitle{display:flex;align-items:center;gap:10px;font:700 clamp(9px,1.35vw,15px) var(--f-lat);letter-spacing:.24em;color:var(--gold2);text-shadow:0 2px 6px #000}
.subtitle::before,.subtitle::after{content:"";width:clamp(18px,4vw,56px);height:2px;background:linear-gradient(90deg,transparent,var(--gold));}
.subtitle::after{transform:scaleX(-1)}
.menu .btns{display:flex;flex-direction:column;gap:10px;width:min(100%,300px);margin-top:10px}
.menu .tag{margin-top:6px;font-size:.85rem;color:#f9e7b0;text-shadow:0 1px 6px #000}
.motes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.motes i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px 3px #ffd36a99;opacity:0;animation:mote var(--t) linear infinite;animation-delay:var(--d)}

/* ---------- world map ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;padding:14px}
.mapbox{position:relative;aspect-ratio:760/460;border-radius:10px;overflow:hidden;border:3px solid #7a5a2a;box-shadow:0 6px 20px #000a,inset 0 0 40px #5a3a1a88;background:#d8bd84}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.pin .med{width:clamp(34px,5.6vw,52px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);background:radial-gradient(circle at 35% 30%,#d4683a,#7a2c12);color:#fff1cf;font:700 clamp(15px,2.2vw,22px) var(--f-head);box-shadow:0 3px 0 #2a0f04,0 6px 12px #0009;transition:transform .15s}
.pin:hover .med{transform:scale(1.12)}
.pin.sel .med{box-shadow:0 0 0 4px #fff3c088,0 0 20px 6px #ffd36acc,0 3px 0 #2a0f04}
.pin.done .med{background:radial-gradient(circle at 35% 30%,#58b068,#1f5a30)}
.pin.locked .med{background:radial-gradient(circle at 35% 30%,#8a8478,#4a463e);border-color:#a79f8a;color:#d9d1bb}
.pin.cur .med{animation:pulse 1.8s infinite}
.pin .med svg{width:55%;height:55%}
.pin .lab{font:700 clamp(9px,1.35vw,12.5px)/1.2 var(--f-head);color:#fff0c8;background:#3a1d0ee6;border:1px solid var(--gold-d);border-radius:6px;padding:2px 7px;text-align:center;white-space:nowrap;box-shadow:0 2px 6px #0007}
.pin .lab small{display:block;font-size:.85em;color:var(--gold2)}
.sidecard{display:flex;flex-direction:column;gap:10px;padding:12px;align-self:start}
.sidecard .thumb{aspect-ratio:16/11;border-radius:8px;overflow:hidden;border:2px solid #8a6a35;box-shadow:0 3px 10px #0007}
.sidecard .thumb svg{width:100%;height:100%}
.sidecard h3{font-size:1.15rem}
.stars{display:flex;gap:4px}
.stars svg{width:24px;height:24px}
.stars .on{color:#f0b82e;filter:drop-shadow(0 1px 0 #7a4a08)}
.stars .off{color:#a8957a;opacity:.55}

/* ---------- level layouts ---------- */
.lvl{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px}
.lvl.one{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:3px solid var(--gold-d);background:#16241a;box-shadow:0 6px 20px #000a}
.scene>svg.art{position:absolute;inset:0;width:100%;height:100%}
.hs{position:absolute;width:clamp(34px,6%,54px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff3c0;background:radial-gradient(#ffe9a877,#e3b65722 62%,transparent 72%);color:#fff7d6;display:grid;place-items:center;animation:pulse 2.2s infinite;z-index:2}
.hs svg{width:52%;height:52%;filter:drop-shadow(0 1px 2px #000)}
.hs:hover{background:radial-gradient(#fff3c0aa,#e3b65744 62%,transparent 72%)}
.hs.found{animation:none;border-color:var(--ok);background:#6fdc8333;color:var(--ok)}
.hs.hint{border-color:#fff;animation:pulse .9s infinite;box-shadow:0 0 0 4px #fff8}
.caption{position:absolute;left:12px;bottom:12px;max-width:62%;padding:.45em .9em;border-radius:8px;background:#2a160bd9;border:1px solid var(--gold-d);font-size:.92rem;color:#fbeab8;z-index:3}
.cta{position:absolute;right:12px;bottom:12px;z-index:4}
.cluecard{position:absolute;left:0;right:0;margin-inline:auto;top:12px;width:min(92%,520px);z-index:5;padding:12px 14px;animation:pop .25s ease;display:flex;gap:12px;align-items:flex-start}
.cluecard .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#7a2c12;color:var(--gold2);border:2px solid var(--gold)}
.cluecard .ic svg{width:24px;height:24px}
.cluecard h4{font:700 1rem var(--f-head);color:#5a2c10}
.cluecard p{font-size:.95rem;line-height:1.5}
.cluecard .x{margin-left:auto;flex:none;width:30px;height:30px;color:var(--ink2)}
.inv{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.inv .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:10px;border:2px solid var(--gold-d);background:radial-gradient(#4a2c18,#24130a);display:grid;place-items:center;color:var(--gold2);box-shadow:inset 0 0 12px #000a}
.slot svg{width:62%;height:62%}
.slot.new{animation:pop .4s ease}
.slot.empty{border-style:dashed;opacity:.6}
.meter{height:10px;border-radius:99px;background:#1a0d06;border:1px solid var(--gold-d);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#c98b2e,#f6dc95);transition:width .4s}
.stat-row{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;color:var(--txt2)}
.stat-row b{color:var(--gold2);font-family:var(--f-head)}

/* matching */
.board{padding:16px 16px 18px}
.board .lead{text-align:center;margin-bottom:12px;font:600 1rem var(--f-head);color:#5a2c10}
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(36px,9vw,110px) minmax(0,1fr);row-gap:10px;align-items:stretch}
.match .cell{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fbf1d4cc;border:2px solid #b8975a;min-height:64px;text-align:left;color:var(--ink);transition:transform .12s,border-color .12s,background .12s;position:relative}
.match .cell:hover{transform:translateY(-1px);border-color:#7a4a1a}
.match .cell.sel{border-color:var(--brick2);background:#fff4d0;box-shadow:0 0 0 3px #b9502a55}
.match .cell.linked{border-color:#7a4a1a;background:#fff1c8}
.match .cell.ok{border-color:#2f8a43;background:#e3f4d0}
.match .cell.bad{border-color:#c4472a;background:#ffe0d4;animation:shake .4s}
.match .cell .ti{flex:none;width:clamp(48px,11vw,84px);aspect-ratio:16/11;border-radius:6px;overflow:hidden;border:1px solid #8a6a35}
.match .cell .ti svg{width:100%;height:100%}
.match .cell b{font:700 clamp(.85rem,2.2vw,1.05rem)/1.3 var(--f-head)}
.match .cell span{font-size:clamp(.8rem,2.1vw,.98rem);line-height:1.4}
.match .cell .dot{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#e3b657;border:2px solid #7a4a1a}
.match .cell.L .dot{right:-8px}.match .cell.R .dot{left:-8px}
.match .gap{grid-column:2}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lines path{fill:none;stroke:#7a4a1a;stroke-width:3;stroke-linecap:round}
.lines path.ok{stroke:#2f8a43}.lines path.bad{stroke:#c4472a;stroke-dasharray:6 6}

/* cipher */
.cipher{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:14px}
.cipher .msg{padding:16px}
.glyphs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-block:10px}
.glyph{aspect-ratio:1;border-radius:8px;background:#fbf1d466;border:1px solid #a98550;display:grid;place-items:center;color:#4a2610}
.glyph svg{width:72%;height:72%}
.keygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.key{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:8px;background:#fbf1d4aa;border:2px solid #b8975a;color:#4a2610;transition:transform .12s,background .12s}
.key:hover{transform:translateY(-2px);background:#fff4d0;border-color:var(--brick2)}
.key svg{width:34px;height:34px}
.key b{font:700 1.3rem/1 var(--f-head)}
.slots-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-block:10px}
.sl{width:clamp(34px,8vw,46px);aspect-ratio:.82;border-radius:8px;border:2px solid #8a6a35;background:#fff8e0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 2px;color:#4a2610}
.sl.sel{border-color:var(--brick2);box-shadow:0 0 0 3px #b9502a55}
.sl.ok{border-color:#2f8a43;background:#e3f4d0}
.sl.bad{border-color:#c4472a;background:#ffe0d4;animation:shake .4s}
.sl svg{width:70%;height:auto;aspect-ratio:1}
.sl b{font:700 1.2rem/1 var(--f-head);min-height:1.2em}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* map pieces */
.puz3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;padding:14px}
.mboard{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3px;aspect-ratio:760/460;padding:6px;border-radius:10px;background:#5a3a1a;border:3px solid #7a5a2a;box-shadow:inset 0 0 30px #000a}
.mslot{position:relative;border-radius:4px;background:#00000033;border:2px dashed #c9a35a88;overflow:hidden;transition:background .15s}
.mslot:hover,.mslot.hot{background:#e3b65733}
.mslot.ok{border:0;animation:pop .35s}
.mslot.shake{animation:shake .4s}
.mslot svg{position:absolute;inset:0;width:100%;height:100%}
.tray{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.piece{position:relative;aspect-ratio:760/460*2/3;border-radius:6px;overflow:hidden;border:2px solid #8a6a35;background:#d8bd84;touch-action:none;cursor:grab;box-shadow:0 3px 8px #0008;transition:transform .12s,box-shadow .12s}
.piece:hover{transform:translateY(-2px) rotate(-1deg)}
.piece.sel{box-shadow:0 0 0 3px var(--gold2),0 6px 14px #000a;transform:scale(1.04)}
.piece.used{visibility:hidden}
.piece svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ghost{position:fixed;z-index:200;pointer-events:none;border-radius:6px;overflow:hidden;border:2px solid var(--gold2);box-shadow:0 10px 24px #000b;opacity:.95;transform:rotate(-3deg) scale(1.05)}
.ghost svg{width:100%;height:100%}

/* market */
.market{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:14px}
.routes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.route{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border-radius:10px;border:2px solid #b8975a;background:#fbf1d4cc;color:var(--ink);transition:transform .12s,border-color .12s}
.route:hover{transform:translateY(-1px);border-color:#7a4a1a}
.route .rd{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #7a4a1a;background:#fff8e0;display:grid;place-items:center;margin-top:2px;color:#fff}
.route.on{border-color:var(--brick2);background:#fff1c8;box-shadow:0 0 0 3px #b9502a44}
.route.on .rd{background:var(--brick2)}
.route .rd svg{width:14px;height:14px;opacity:0}
.route.on .rd svg{opacity:1}
.route b{display:block;font:700 .98rem var(--f-head)}
.route small{display:block;color:var(--ink2);font-size:.82rem;line-height:1.4}
.route .days{color:#8c3a1c;font-weight:700}
.goods{display:flex;flex-direction:column;gap:8px}
.good{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#1c0e06;border:1px solid #6a4a22}

    [.04,.17,.3,.42,.53,.63].forEach((y,i)=>{const w=.034-i*.003;s+=`<rect x="${f1(cx-w*h)}" y="${f1(by-(y+.055)*h)}" width="${f1(w*2*h)}" height="${f1(.05*h)}" rx="${f1(w*h)}" fill="#0000004d"/>`});

  }

}

/* ---------- audio (all synthesised, no files) ---------- */
const AU={ctx:null,master:null,musG:null,timer:null,step:0,next:0};
function actx(){
  if(!AU.ctx){
    try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ctx.destination);AU.musG=AU.ctx.createGain();AU.musG.gain.value=.55;AU.musG.connect(AU.master)}catch(e){return null}
  }
  if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});
  return AU.ctx;
}
function tone(f,t,d,o={}){
  const c=AU.ctx;if(!c)return;
  const {type='triangle',v=.14,bus='sfx',a=.006}=o;
  const os=c.createOscillator(),g=c.createGain();
  os.type=type;os.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g);g.connect(bus==='mus'?AU.musG:AU.master);os.start(t);os.stop(t+d+.05);
}
function sfx(n){
  if(!S.sfx)return;const c=actx();if(!c)return;const t=c.currentTime;
  try{switch(n){
    case 'click':tone(560,t,.07,{type:'square',v:.03});break;
    case 'ok':[523,659,784].forEach((f,i)=>tone(f,t+i*.09,.3,{v:.12}));break;
    case 'bad':tone(190,t,.28,{type:'sawtooth',v:.06});tone(150,t+.12,.3,{type:'sawtooth',v:.06});break;
    case 'find':[880,1175,1568].forEach((f,i)=>tone(f,t+i*.07,.4,{v:.08,type:'sine'}));break;
    case 'place':tone(330,t,.12,{v:.12});tone(494,t+.06,.22,{v:.1});break;
    case 'win':[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.11,.45,{v:.12}));break;
  }}catch(e){}
}
const SC=[0,2,4,7,9];
const MEL=[4,3,2,3,4,2,1,2,3,2,0,1,2,1,0,-1,4,3,2,4,5,4,3,2,3,2,1,2,0,1,0,-2];
const dfreq=d=>261.63*Math.pow(2,(SC[((d%5)+5)%5]+12*Math.floor(d/5))/12);
function musicSched(){
  const c=AU.ctx;if(!c)return;
  while(AU.next<c.currentTime+.7){
    const i=AU.step%MEL.length,f=dfreq(MEL[i]);
    tone(f,AU.next,.95,{v:.06,bus:'mus'});tone(f*2,AU.next,.35,{v:.012,type:'sine',bus:'mus'});
    if(i%8===0){tone(130.81,AU.next,3.6,{v:.05,type:'sine',bus:'mus'});tone(196,AU.next,3.6,{v:.03,type:'sine',bus:'mus'})}
    AU.step++;AU.next+=.46;
  }
}
function musicOn(){
  if(!S.music)return;const c=actx();if(!c||AU.timer)return;
  AU.next=c.currentTime+.1;AU.timer=setInterval(musicSched,200);musicSched();
}
function musicOff(){if(AU.timer){clearInterval(AU.timer);AU.timer=null}}

/* ---------- toast, confetti, modal ---------- */
function toast(msg){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#e3b657','#b9502a','#6fdc83','#f6dc95','#3f7c80','#ffffff'];
  const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:rnd(-1.4,1.4),vy:rnd(2,5),r:rnd(5,10),a:rnd(0,6),va:rnd(-.2,.2),c:cols[Math.random()*cols.length|0]}));
  let f=0;(function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);ctx.restore()});
    if(++f<190)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
let MODAL=null;
function modal(html,o={}){
  const {cls='',key='',close=true,onClose=null,low=false}=o;
  if(MODAL&&key&&MODAL.key===key){const m=$('.modal',MODAL.el);m.className='modal '+cls;m.innerHTML=html;MODAL.onClose=onClose;return}
  closeModal(true);
  const el=document.createElement('div');el.className='mback';
  el.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  $('#modal-root').appendChild(el);
  if(close)el.addEventListener('click',e=>{if(e.target===el)closeModal()});
  MODAL={el,key,onClose};
}
function closeModal(silent){
  if(!MODAL)return;const {el,onClose}=MODAL;MODAL=null;el.remove();
  if(!silent&&onClose)onClose();
}

function startLevel(id){
  if(!unlocked(id)){toast('ผ่านด่านก่อนหน้าเพื่อปลดล็อกด่านนี้');return}
  ST.sel=id;
  R={id,t0:Date.now(),hints:3,used:0,ok:0,bad:0,bonus:0};
  LV[id].init();
  LV[id].render();
  window.scrollTo({top:0});
  dialog([{who:`ด่านที่ ${id} : ${LEVELS[id-1].title}`,t:INTRO[id]}],()=>{});
}
function finishLevel(){
  const id=R.id,secs=Math.round((Date.now()-R.t0)/1000),att=R.ok+R.bad,acc=att?R.ok/att:1;
  let score=1000-R.bad*70-R.used*60+Math.max(0,240-Math.floor(secs/2))+R.bonus;
  score=Math.max(300,Math.min(1500,Math.round(score)));
  const stars=(acc>=.9&&R.used<=1)?3:acc>=.65?2:1;
  const prev=S.done[id],best=!prev||score>prev.score;
  const res={score,stars,secs,used:R.used,acc:Math.round(acc*100)};
  if(best)S.done[id]={score,stars,secs,used:R.used,acc:res.acc};
  const rw=REWARD[id]||{};
  if(rw.item&&!S.items.includes(rw.item))S.items.push(rw.item);
  if(rw.clue&&!S.clues.some(c=>c.t===rw.clue.t))S.clues.push(rw.clue);
  if(!S.know.includes(id))S.know.push(id);
  save();sfx('win');confetti();
  showKnow(id,()=>showSummary(id,res,best,prev));
}

    const b=$('#boat');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
    setTimeout(()=>{
      R.sail=false;b.classList.remove('go');
      const {t,d}=tally(),lack=GOODS.filter(g=>t[g.id]<NEED[g.id]),over=d>LIMIT;
      updMarket();
      if(!lack.length&&!over){
        R.ok++;sfx('ok');$('#res').innerHTML=`<div class="result yes">ส่งสินค้าครบและทันพิธีภายใน ${d} วัน!</div>`;
        $('#go').disabled=true;R.sail=true;setTimeout(finishLevel,1400);
      }else{
        R.bad++;sfx('bad');
        lack.forEach(g=>$('#g-'+g.id).classList.add('shortage'));
        const msg=[];if(lack.length)msg.push('สินค้าไม่ครบ ขาด '+lack.map(g=>`${g.name} ${NEED[g.id]-t[g.id]}`).join(', '));if(over)msg.push(`ใช้เวลา ${d} วัน เกินกำหนด ${LIMIT} วัน`);
        $('#res').innerHTML=`<div class="result no">${msg.join('<br>')}</div>`;
      }
    },2800);
  }
});

/* ------------------------------------------------------------------ L5 */
const EVT=[
 {t:'สถาปนากรุงศรีอยุธยา',d:'สมเด็จพระรามาธิบดีที่ 1 (พระเจ้าอู่ทอง) ทรงสถาปนาราชธานี',y:'พ.ศ. 1893'},
 {t:'เสียกรุงครั้งที่ 1',d:'กองทัพหงสาวดีตีกรุงศรีอยุธยาแตก',y:'พ.ศ. 2112'},
 {t:'ยุทธหัตถี',d:'สมเด็จพระนเรศวรมหาราชทรงกระทำยุทธหัตถี',y:'พ.ศ. 2135'},
 {t:'ราชทูตไปฝรั่งเศส',d:'คณะราชทูตสยามเข้าเฝ้าพระเจ้าหลุยส์ที่ 14 ที่พระราชวังแวร์ซาย',y:'พ.ศ. 2229'},
 {t:'เสียกรุงครั้งที่ 2',d:'กรุงศรีอยุธยาล่มสลาย',y:'พ.ศ. 2310'},
 {t:'ขึ้นทะเบียนมรดกโลก',d:'ยูเนสโกขึ้นทะเบียนนครประวัติศาสตร์พระนครศรีอยุธยา',y:'พ.ศ. 2534'}
];
LV[5]={
 init(){let o;do{o=shuffle([0,1,2,3,4,5])}while(o.every((v,i)=>v===i));R.list=o;R.lock=Array(6).fill(false);R.sel=null;R.res=[];R.reveal=false;R.busy=false},
 render(){
  root().innerHTML=`<section class="screen">${hud('ด่านที่ 5 : ประตูพระคลังหลวง')}<div class="lvl one"><div class="col">
  <div class="scene banner vault" id="vault">${palaceScene()}<div class="caption">${ico('lock')}ประตูพระคลังล็อกอยู่ ต้องเรียงลำดับเหตุการณ์ให้ถูกต้อง</div></div>
  <div class="paper board"><p class="lead">เรียงจาก “เก่าที่สุด” (บนสุด) ไป “ใหม่ที่สุด” (ล่างสุด) แตะการ์ดสองใบเพื่อสลับตำแหน่ง หรือกดลูกศร</p><div class="tl" id="tl"></div>
  <div class="row-btns"><button class="btn lg" data-act="echk">ตรวจคำตอบ</button></div></div></div></div></section>`;
  drawTL();
 },
 hint(){
  const i=R.list.findIndex((v,k)=>v!==k&&!R.lock[k]);
  if(i<0||R.busy)return false;
  const j=R.list.indexOf(i);[R.list[i],R.list[j]]=[R.list[j],R.list[i]];
  R.lock[i]=true;R.sel=null;R.res=[];drawTL();toast('ล็อกการ์ดที่ถูกตำแหน่งให้ 1 ใบ');sfx('ok');return true;
 }
};
function drawTL(){
  const el=$('#tl');if(!el)return;
  el.innerHTML=R.list.map((e,i)=>{
    const ev=EVT[e],lk=R.lock[i];
    return `<div class="ev ${R.sel===i?'sel':''} ${R.res[i]||''}" data-act="esel" data-i="${i}" role="button" tabindex="0"><span class="no">${i+1}</span><span class="tx"><b>${ev.t}</b><small>${ev.d}</small></span>${(R.reveal||lk)?`<span class="yr">${ev.y}</span>`:''}${lk?`<span class="lkic">${ico('lock')}</span>`:`<span class="mv"><button data-act="eup" data-i="${i}" aria-label="เลื่อนขึ้น" ${i===0?'disabled':''}>${ico('up')}</button><button data-act="edn" data-i="${i}" aria-label="เลื่อนลง" ${i===5?'disabled':''}>${ico('down')}</button></span>`}</div>`;
  }).join('');
}
function swapEv(a,b){
  if(R.busy||a<0||b<0||a>5||b>5||R.lock[a]||R.lock[b])return;
  [R.list[a],R.list[b]]=[R.list[b],R.list[a]];R.sel=null;R.res=[];sfx('place');drawTL();
}
Object.assign(ACT,{
  esel:el=>{
    const i=+el.dataset.i;if(R.busy||R.lock[i])return;
    if(R.sel===null)R.sel=i;else if(R.sel===i)R.sel=null;else{swapEv(R.sel,i);return}
    drawTL();
  },
  eup:el=>swapEv(+el.dataset.i,+el.dataset.i-1),
  edn:el=>swapEv(+el.dataset.i,+el.dataset.i+1),
  echk:()=>{
    if(R.busy)return;let n=0;
    R.list.forEach((v,i)=>{const ok=v===i;R.res[i]=ok?'ok':'bad';if(ok)n++});
    R.sel=null;
    if(n===6){
      R.ok++;R.busy=true;R.reveal=true;R.list=[0,1,2,3,4,5];drawTL();sfx('win');
      $('#vault').classList.add('open');setTimeout(finishLevel,2400);
    }else{R.bad++;sfx('bad');drawTL();toast(`ถูกตำแหน่ง ${n} จาก 6 ใบ ลองสลับการ์ดสีแดงดูใหม่`)}
  }
});

document.addEventListener('pointerdown',()=>{if(!started){started=true;if(S.music){actx();musicOn()}}},{once:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicOff();else if(started&&S.music)musicOn()});
SCR.menu();
